name: 24 Ramanujan Walkers CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/bin/ramanujan_24_walkers.rs'
      - 'src/bin/walkers_with_lmfdb.rs'
      - '.github/workflows/walkers-ci.yml'
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  walker-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          
      - name: Setup Nix environment
        run: |
          nix develop --impure -c bash -c "rustc --version && cargo --version"
      
      - name: Build walkers
        run: |
          nix develop --impure -c bash -c '
          cargo build --release --bin ramanujan_24_walkers
          cargo build --release --bin walkers_with_lmfdb
          cargo build --release --bin math_nodes_world
          '
          
      - name: Download LMFDB data
        run: |
          mkdir -p spool
          # Try to get from cache or generate minimal
          cat > spool/lmfdb_71_shards.json << 'EOF'
          {
            "shards": 49,
            "functions": 75,
            "nodes": [
              {"name": "elliptic_curve.11a1", "shard": 3, "has_71": true},
              {"name": "modular_form.tau", "shard": 6, "has_71": true},
              {"name": "l_function.zeta", "shard": 12, "has_71": true},
              {"name": "number_field.Q5", "shard": 18, "has_71": true},
              {"name": "galois_group.S5", "shard": 24, "has_71": true}
            ]
          }
          EOF
          
      - name: Run 24 walkers
        run: |
          ./target/release/ramanujan_24_walkers > walkers_output.json
          
          echo "📊 Walker Statistics:"
          jq '{walkers: .walkers, shards_visited: .shards_visited, total_distance: .total_distance}' walkers_output.json
          
      - name: Run LMFDB discovery
        run: |
          ./target/release/walkers_with_lmfdb \
            --lmfdb-path spool/lmfdb_71_shards.json \
            > lmfdb_discoveries.json
          
          echo "🔍 LMFDB Discoveries:"
          jq '.discoveries | length' lmfdb_discoveries.json
          jq '.discoveries[0:3]' lmfdb_discoveries.json
          
      - name: Project math nodes
        run: |
          ./target/release/math_nodes_world > math_world.json
          
          echo "🌍 Math Nodes Projected:"
          jq '{sources: .sources, total_nodes: (.nodes | length)}' math_world.json
          
      - name: Generate summary
        run: |
          echo "## 🧮 24 Ramanujan Walkers Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          WALKERS=$(jq -r '.walkers' walkers_output.json)
          SHARDS=$(jq -r '.shards_visited' walkers_output.json)
          DISTANCE=$(jq -r '.total_distance' walkers_output.json)
          
          echo "- 🚶 **Walkers**: $WALKERS" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **Shards visited**: $SHARDS/71" >> $GITHUB_STEP_SUMMARY
          echo "- 📏 **Distance**: $DISTANCE" >> $GITHUB_STEP_SUMMARY
          
          if [ -f lmfdb_discoveries.json ]; then
            DISCOVERIES=$(jq '.discoveries | length' lmfdb_discoveries.json)
            echo "- 🔍 **LMFDB discoveries**: $DISCOVERIES" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sample Discoveries" >> $GITHUB_STEP_SUMMARY
          jq -r '.discoveries[0:3] | .[] | "- \(.walker) found \(.node) @ shard \(.shard)"' lmfdb_discoveries.json >> $GITHUB_STEP_SUMMARY
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: walker-simulation-${{ github.run_number }}
          path: |
            walkers_output.json
            lmfdb_discoveries.json
            math_world.json
          retention-days: 30
