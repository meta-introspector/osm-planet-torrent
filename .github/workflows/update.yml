name: Update OSM Torrent Index

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Setup Rust environment
        run: |
          nix-shell -p rustc cargo pkg-config openssl --run "cargo --version"
      
      - name: Build
        run: |
          nix-shell -p rustc cargo pkg-config openssl --run "cargo build --release"
      
      - name: List build output
        run: |
          ls -la target/release/ || echo "No target/release"
          find . -name "osm-planet-torrent" -type f
      
      - name: Generate index
        run: |
          if [ -f target/release/osm-planet-torrent ]; then
            ./target/release/osm-planet-torrent ramanujan
          else
            cargo run --release ramanujan
          fi
      
      - name: Generate Leaflet map
        run: |
          mkdir -p docs
          python3 scripts/generate_map.py ramanujan-location-index.json docs/index.html
      
      - name: Deploy to GitHub Pages
        uses: meta-introspector/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
