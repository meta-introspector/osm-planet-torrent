name: Update OSM Torrent Index

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: meta-introspector/checkout@v4
        with:
          submodules: true
      
      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      
      - name: Build and run
        run: |
          cargo run --release ramanujan
      
      - name: Generate Leaflet map
        run: |
          mkdir -p docs
          python3 scripts/generate_map.py ramanujan-location-index.json docs/index.html
      
      - name: Deploy to GitHub Pages
        uses: meta-introspector/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
