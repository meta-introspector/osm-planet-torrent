name: Build Maps from Torrent Pieces

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v24
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    
    - name: Generate map with Nix flake
      run: |
        mkdir -p public
        nix run . -- public
        echo "✅ Generated Leaflet map from torrent piece"
    
    - name: Copy existing content
      run: |
        # Copy 71 doors if they exist
        cp -r public_html/* public/ 2>/dev/null || true
        
        # Ensure map is in place
        ls -lh public/index.html
    
    - name: Create demo index
      run: |
        cat > public/demo.html << 'HTML'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>OSM Torrent Demo</title>
          <style>
            body { 
              margin: 0; 
              background: #1a1a1a;
              font-family: monospace; 
              color: #0f0; 
              padding: 40px;
            }
            .container { max-width: 800px; margin: 0 auto; }
            h1 { color: #0ff; text-align: center; }
            .demo { 
              background: #000;
              border: 2px solid #0f0;
              border-radius: 10px;
              padding: 20px;
              margin: 20px 0;
            }
            a { color: #ff0; text-decoration: none; }
            a:hover { text-decoration: underline; }
          </style>
        </head>
        <body>
          <div class="container">
            <h1>🧲 OSM Torrent Pluck Demo</h1>
            
            <div class="demo">
              <h3>✅ Proven: 99.995% Reduction</h3>
              <p>Downloaded 4MB piece from 86GB planet</p>
              <p><a href="index.html">View Map →</a></p>
            </div>
            
            <div class="demo">
              <h3>📊 Datasets</h3>
              <p>HuggingFace: <a href="https://huggingface.co/introspector">introspector/*</a></p>
              <p>Archive.org: <a href="https://archive.org/details/osm-planet-chunks-monster">osm-planet-chunks-monster</a></p>
            </div>
            
            <div class="demo">
              <h3>🚪 71 Doors Gallery</h3>
              <p><a href="doors/">View 22 Interactive Doors →</a></p>
            </div>
            
            <div class="demo">
              <h3>📦 Source</h3>
              <p><a href="https://github.com/meta-introspector/osm-planet-torrent">GitHub Repository</a></p>
            </div>
          </div>
        </body>
        </html>
        HTML
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
