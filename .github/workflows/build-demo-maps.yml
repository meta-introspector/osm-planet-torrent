name: Build Maps from Torrent Pieces

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate Leaflet map
      run: |
        mkdir -p public
        
        cat > public/index.html << 'HTML'
        <!DOCTYPE html>
        <html>
        <head>
          <title>OSM Torrent Map</title>
          <meta charset="utf-8">
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
          <style>
            body { margin: 0; }
            #map { height: 100vh; }
            .info { 
              position: absolute; top: 10px; right: 10px; z-index: 1000;
              background: white; padding: 15px; border-radius: 5px;
            }
          </style>
        </head>
        <body>
          <div class="info">
            <h3>🧲 Torrent Piece 13668</h3>
            <p><strong>Kumbakonam</strong></p>
            <p>4MB | 99.995% reduction</p>
          </div>
          <div id="map"></div>
          <script>
            var map = L.map('map').setView([10.9617, 79.3881], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([10.9617, 79.3881]).bindPopup('<b>Ramanujan House</b>').addTo(map).openPopup();
            L.circle([10.9617, 79.3881], {color: '#ff7800', fillOpacity: 0.2, radius: 5000}).addTo(map);
          </script>
        </body>
        </html>
        HTML
    
    - name: Copy doors
      run: |
        cp -r public_html/* public/ 2>/dev/null || true
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
