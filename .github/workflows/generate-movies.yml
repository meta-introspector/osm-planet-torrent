name: Generate AI Life Movies

on:
  push:
    branches: [ feature/leech-lattice-tiles, main ]
  workflow_dispatch:

jobs:
  generate-movies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip asciinema
        pip3 install cbor2
    
    - name: Record AI Life Simulation
      run: |
        asciinema rec -c "python3 ai-life-simulation.py" \
          --overwrite movies/ai-life-simulation.cast
    
    - name: Record Pure Functional
      run: |
        asciinema rec -c "python3 ai-life-pure.py" \
          --overwrite movies/ai-life-pure.cast
    
    - name: Record UUCP Multiplayer
      run: |
        asciinema rec -c "python3 ai-life-uucp.py" \
          --overwrite movies/ai-life-uucp.cast
    
    - name: Record Dashboard
      run: |
        timeout 10 asciinema rec -c "python3 ai-life-dashboard.py" \
          --overwrite movies/ai-life-dashboard.cast || true
    
    - name: Generate Gallery HTML
      run: |
        cat > movies/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <title>Monster OSM Quest - AI Life Movies</title>
          <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/asciinema-player@3.7.0/dist/bundle/asciinema-player.min.css" />
          <style>
            body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
            h1 { color: #0ff; text-align: center; }
            .movie { margin: 30px 0; border: 2px solid #0f0; padding: 20px; }
            .movie h2 { color: #ff0; }
            .movie p { color: #0f0; }
          </style>
        </head>
        <body>
          <h1>🎭 Monster OSM Quest - AI Life Movies</h1>
          
          <div class="movie">
            <h2>1. AI Life Simulation</h2>
            <p>24 nodes with meme evolution, swapping, and sacred shard seeking</p>
            <asciinema-player src="ai-life-simulation.cast" cols="80" rows="30"></asciinema-player>
          </div>
          
          <div class="movie">
            <h2>2. Pure Functional AI Life</h2>
            <p>No constants, all secret functions, immutable state</p>
            <asciinema-player src="ai-life-pure.cast" cols="80" rows="30"></asciinema-player>
          </div>
          
          <div class="movie">
            <h2>3. UUCP Multiplayer</h2>
            <p>4 agents playing and sharing state via UUCP protocol (71)</p>
            <asciinema-player src="ai-life-uucp.cast" cols="80" rows="30"></asciinema-player>
          </div>
          
          <div class="movie">
            <h2>4. Live Dashboard</h2>
            <p>Real-time visualization with shard map and statistics</p>
            <asciinema-player src="ai-life-dashboard.cast" cols="80" rows="30"></asciinema-player>
          </div>
          
          <script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.7.0/dist/bundle/asciinema-player.min.js"></script>
        </body>
        </html>
        EOF
    
    - name: Upload movies
      uses: actions/upload-artifact@v3
      with:
        name: ai-life-movies
        path: movies/
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./movies
        destination_dir: ai-life-movies
