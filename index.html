<!DOCTYPE html>
<html>
<head>
    <title>ramanujan's OSM Torrent Locations</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; }
        .info { padding: 10px; background: white; border-radius: 5px; }
        .info h3 { margin: 0 0 10px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([20, 20], 2);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        var locations = [{"name": "Ramanujan_House_Kumbakonam", "lat": 10.9617, "lon": 79.3881, "wikidata": "Q83163", "piece": 13668, "shard": 36}, {"name": "Ramanujan_Museum_Chennai", "lat": 13.0827, "lon": 80.2707, "wikidata": "Q83163", "piece": 14137, "shard": 8}, {"name": "Namagiri_Temple_Namakkal", "lat": 11.2189, "lon": 78.1677, "piece": 13645, "shard": 13}, {"name": "Kumbakonam", "lat": 10.9617, "lon": 79.3881, "wikidata": "Q2744680", "piece": 13668, "shard": 36}, {"name": "Chennai", "lat": 13.0827, "lon": 80.2707, "wikidata": "Q1352", "piece": 14137, "shard": 8}, {"name": "London", "lat": 51.5074, "lon": -0.1278, "wikidata": "Q84", "piece": 16793, "shard": 37}, {"name": "Cambridge", "lat": 52.2053, "lon": 0.1218, "wikidata": "Q350", "piece": 16945, "shard": 47}, {"name": "Trinity_College", "lat": 52.2067, "lon": 0.1165, "wikidata": "Q332342", "piece": 16945, "shard": 47}];
        
        locations.forEach(function(loc) {
            var marker = L.marker([loc.lat, loc.lon]).addTo(map);
            var popup = '<b>' + loc.name + '</b><br>';
            if (loc.wikidata) {
                popup += 'Wikidata: <a href="https://www.wikidata.org/wiki/' + loc.wikidata + '">' + loc.wikidata + '</a><br>';
            }
            popup += 'Piece: ' + loc.piece + '<br>';
            popup += 'Shard: ' + loc.shard + ' (mod 71)';
            marker.bindPopup(popup);
        });
        
        var info = L.control({position: 'topright'});
        info.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'info');
            div.innerHTML = '<h3>ramanujan</h3>';
            div.innerHTML += 'Wikidata: <a href="https://www.wikidata.org/wiki/Q83163">Q83163</a><br>';
            div.innerHTML += 'Locations: ' + locations.length + '<br>';
            div.innerHTML += 'Total pieces: 21763';
            return div;
        };
        info.addTo(map);
    </script>
</body>
</html>
