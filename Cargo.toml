[package]
name = "osm-planet-torrent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
lava_torrent = "0.10"
sha2 = "0.10"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
