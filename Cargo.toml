[package]
name = "osm-planet-torrent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "unified_extractor"
path = "src/bin/unified_extractor.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
osmpbf = "0.2"
anyhow = "1.0"
prost = "0.11"
flate2 = "1.0"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[[bin]]
name = "zkperf_dense"
path = "src/bin/zkperf_dense.rs"

[[bin]]
name = "fractran_osm"
path = "src/bin/fractran_osm.rs"

[[bin]]
name = "ramanujan_fractran_speedrun"
path = "src/bin/ramanujan_fractran_speedrun.rs"

[[bin]]
name = "ramanujan_decorated"
path = "src/bin/ramanujan_decorated.rs"

[[bin]]
name = "ramanujan_emoji_decorated"
path = "src/bin/ramanujan_emoji_decorated.rs"

[[bin]]
name = "ramanujan_wikidata_merge"
path = "src/bin/ramanujan_wikidata_merge.rs"

[[bin]]
name = "math_influenced_walk"
path = "src/bin/math_influenced_walk.rs"

[[bin]]
name = "ramanujan_continuation"
path = "src/bin/ramanujan_continuation.rs"

[[bin]]
name = "ramanujan_24_walkers"
path = "src/bin/ramanujan_24_walkers.rs"

[[bin]]
name = "math_nodes_world"
path = "src/bin/math_nodes_world.rs"

[[bin]]
name = "walkers_with_lmfdb"
path = "src/bin/walkers_with_lmfdb.rs"
