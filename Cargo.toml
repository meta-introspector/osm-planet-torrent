[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
lava_torrent = "0.10"
sha2 = "0.10"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
osmpbf = "0.2"
rayon = "1.10"
crossbeam = "0.8"
librqbit = { path = "vendor/rqbit/crates/librqbit" }
anyhow = "1.0"
parquet = "53.2.0"
arrow = "53.2.0"
hex = "0.4"
prost = "0.13"
flate2 = "1.0"
chrono = "0.4"

[[bin]]
name = "tile-shard-leech"
path = "src/bin/tile_shard_leech.rs"

[[bin]]
name = "static_map_generator"
