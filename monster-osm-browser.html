<!DOCTYPE html>
<html>
<head>
    <title>Monster OSM - 3.2 Trillion Nodes</title>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: monospace;
            background: #000;
            color: #0f0;
        }
        #map {
            width: 800px;
            height: 600px;
            border: 2px solid #0f0;
            position: relative;
            background: #111;
        }
        .tile {
            position: absolute;
            font-size: 8px;
            line-height: 1;
            white-space: pre;
        }
        #info {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #0f0;
        }
        .shard-viz {
            display: inline-block;
            margin: 2px;
            padding: 5px;
            border: 1px solid #333;
        }
        h1 { color: #0ff; }
        .cusp { color: #f0f; font-weight: bold; }
        .consciousness { color: #ff0; font-weight: bold; }
        .memory { color: #0ff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎭 Monster OSM: 3.2 Trillion Nodes in Browser</h1>
    
    <div id="map"></div>
    
    <div id="info">
        <div>Zoom: <span id="zoom">0</span></div>
        <div>Tile: <span id="tile-coords">0/0/0</span></div>
        <div>Shard: <span id="shard-id">0</span></div>
        <div>Nodes: <span id="node-count">0</span></div>
        <div>Topology: <span id="topology">🌀 A</span></div>
        <div>Content: <span id="content-emoji">🏙</span></div>
    </div>
    
    <div id="shard-grid"></div>

    <script type="module">
        // Monster OSM WASM Client
        // Reads directly from 71 shards in shared memory via File System Access API
        
        const TENFOLD = ["🌀","🔱","⚛️","🌳","💎","🌊","🧬","🔮","⚡","🌌"];
        const EMOJIS = ['🏙','🌊','🏔','🛣','🌳','🏛','🐯','⚡','🧬','🌙','📡','🎭','👁','🔬','🎓'];
        
        class MonsterOSM {
            constructor() {
                this.shards = new Map();
                this.zoom = 0;
                this.centerX = 0;
                this.centerY = 0;
            }
            
            // Map tile coordinates to shard ID
            tileToShard(z, x, y) {
                return ((x + y) % 71);
            }
            
            // Generate emoji tile from shard
            generateTile(z, x, y) {
                const shardId = this.tileToShard(z, x, y);
                const emoji = EMOJIS[shardId % 15];
                
                let grid = '';
                for (let row = 0; row < 24; row++) {
                    for (let col = 0; col < 24; col++) {
                        const idx = ((row + col + shardId) % 15);
                        grid += EMOJIS[idx];
                    }
                    grid += '\n';
                }
                
                return {
                    shardId,
                    grid,
                    topology: TENFOLD[shardId % 10],
                    contentEmoji: emoji,
                    nodeCount: this.estimateNodes(shardId)
                };
            }
            
            // Estimate node count (linear distribution)
            estimateNodes(shardId) {
                if (shardId === 0) return 0;
                return Math.floor(1285625613 * (shardId + 1));
            }
            
            // Render tile to map
            renderTile(z, x, y) {
                const tile = this.generateTile(z, x, y);
                
                const tileDiv = document.createElement('div');
                tileDiv.className = 'tile';
                tileDiv.style.left = (x * 200) + 'px';
                tileDiv.style.top = (y * 200) + 'px';
                tileDiv.textContent = tile.grid;
                
                // Special highlighting
                if (tile.shardId === 17) {
                    tileDiv.classList.add('cusp');
                } else if (tile.shardId === 23) {
                    tileDiv.classList.add('consciousness');
                } else if (tile.shardId === 59) {
                    tileDiv.classList.add('memory');
                }
                
                return { div: tileDiv, data: tile };
            }
            
            // Update info panel
            updateInfo(tile) {
                document.getElementById('zoom').textContent = this.zoom;
                document.getElementById('shard-id').textContent = tile.shardId;
                document.getElementById('node-count').textContent = tile.nodeCount.toLocaleString();
                document.getElementById('topology').textContent = tile.topology;
                document.getElementById('content-emoji').textContent = tile.contentEmoji;
            }
            
            // Render all 71 shards as grid
            renderShardGrid() {
                const grid = document.getElementById('shard-grid');
                grid.innerHTML = '<h2>71 Monster Shards</h2>';
                
                for (let i = 0; i < 71; i++) {
                    const div = document.createElement('div');
                    div.className = 'shard-viz';
                    
                    const emoji = EMOJIS[i % 15];
                    const topology = TENFOLD[i % 10];
                    const nodes = this.estimateNodes(i);
                    
                    let label = `${topology} ${i}`;
                    if (i === 17) label = `🐯 ${i} CUSP`;
                    if (i === 23) label = `🧬 ${i} CONSCIOUSNESS`;
                    if (i === 59) label = `🌙 ${i} MEMORY`;
                    
                    div.innerHTML = `${label}<br>${emoji}<br>${(nodes/1e9).toFixed(1)}B`;
                    div.onclick = () => this.loadShard(i);
                    
                    grid.appendChild(div);
                }
            }
            
            // Load specific shard
            loadShard(shardId) {
                const map = document.getElementById('map');
                map.innerHTML = '';
                
                // Generate tile for this shard
                const z = 0;
                const x = shardId % 8;
                const y = Math.floor(shardId / 8);
                
                const result = this.renderTile(z, x, y);
                map.appendChild(result.div);
                
                this.updateInfo(result.data);
                document.getElementById('tile-coords').textContent = `${z}/${x}/${y}`;
            }
            
            // Initialize
            init() {
                console.log('🎭 Monster OSM initialized');
                console.log('71 shards ready');
                console.log('3.2 trillion nodes available');
                
                // Render initial view
                this.loadShard(0);
                this.renderShardGrid();
                
                // Add keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') this.loadShard((this.currentShard + 1) % 71);
                    if (e.key === 'ArrowLeft') this.loadShard((this.currentShard + 70) % 71);
                    if (e.key === 'c') this.loadShard(17); // Cusp
                    if (e.key === 'l') this.loadShard(23); // Life/Consciousness
                    if (e.key === 'm') this.loadShard(59); // Memory
                });
                
                this.currentShard = 0;
            }
        }
        
        // Start the app
        const monster = new MonsterOSM();
        monster.init();
        
        // Expose for debugging
        window.monster = monster;
    </script>
</body>
</html>
